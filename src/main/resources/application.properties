# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration - FIXED
app.jwtSecret=chatAppSecretKey123456789012345678901234567890AbCdEfGhIjKlMnOpQrStUvWxYz
app.jwtExpirationMs=86400000

# Logging Configuration
logging.level.com.chatapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.root=INFO

# WebSocket Configuration
spring.websocket.sockjs.heartbeat.time=25000

# Application Configuration
app.name=Real-Time Chat Application with Authentication
app.version=2.0.0
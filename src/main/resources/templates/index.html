<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-radius: 10px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .demo-accounts {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: left;
        }

        .demo-accounts h4 {
            color: #333;
            margin-bottom: 1rem;
            text-align: center;
        }

        .demo-account {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #e9ecef;
        }

        .demo-account:hover {
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .demo-account strong {
            color: #667eea;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 1.5rem;
                margin: 1rem;
            }
            
            .auth-tab {
                padding: 0.75rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="header">
            <div class="logo">🔐</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to join amazing conversations</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertMessage" class="alert"></div>

        <!-- Authentication Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showTab('login')">Sign In</button>
            <button class="auth-tab" onclick="showTab('register')">Sign Up</button>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>Authenticating...</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="auth-form active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">👤 Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">🔒 Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary">
                    🚀 Sign In to Chat
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="auth-form">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerUsername">👤 Username</label>
                    <input type="text" id="registerUsername" required placeholder="Choose a username" minlength="3" maxlength="20">
                </div>

                <div class="form-group">
                    <label for="registerEmail">📧 Email</label>
                    <input type="email" id="registerEmail" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="registerFirstName">🏷️ First Name</label>
                    <input type="text" id="registerFirstName" placeholder="Your first name">
                </div>

                <div class="form-group">
                    <label for="registerLastName">🏷️ Last Name</label>
                    <input type="text" id="registerLastName" placeholder="Your last name">
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">🔒 Password</label>
                    <input type="password" id="registerPassword" required placeholder="Create a strong password" minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary">
                    ✨ Create Account
                </button>
            </form>
        </div>

        <!-- Demo Accounts -->
        <div class="demo-accounts">
            <h4>🎮 Try Demo Accounts</h4>
            <div class="demo-account" onclick="fillDemoAccount('admin', 'admin123')">
                <strong>Admin Account</strong><br>
                <small>Username: admin | Password: admin123</small>
            </div>
            <div class="demo-account" onclick="fillDemoAccount('demo', 'demo123')">
                <strong>Demo User</strong><br>
                <small>Username: demo | Password: demo123</small>
            </div>
        </div>
    </div>

    <script>
        // Tab switching functionality
        function showTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.auth-form').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(tabName + 'Form').classList.add('active');

            // Clear alerts
            hideAlert();
        }

        // Handle login form submission
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            showLoading(true);
            hideAlert();

            try {
                const response = await fetch('/api/auth/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store JWT token and user info
                    localStorage.setItem('token', data.accessToken);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.id,
                        username: data.username,
                        email: data.email,
                        firstName: data.firstName,
                        lastName: data.lastName,
                        roles: data.roles
                    }));

                    showAlert('success', '🎉 Login successful! Redirecting to dashboard...');
                    
                    // Redirect to dashboard after short delay
                    setTimeout(() => {
                        // Use replace to prevent back button issues
                        window.location.replace('/dashboard');
                    }, 1500);

                } else {
                    showAlert('error', '❌ ' + (data.message || 'Invalid username or password'));
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('error', '❌ Connection error. Please try again.');
            }

            showLoading(false);
        }

        // Handle register form submission
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const firstName = document.getElementById('registerFirstName').value;
            const lastName = document.getElementById('registerLastName').value;

            showLoading(true);
            hideAlert();

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        username, 
                        email, 
                        password, 
                        firstName, 
                        lastName 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('success', '🎉 Account created successfully! Please sign in.');
                    
                    // Switch to login tab and fill username
                    setTimeout(() => {
                        showTab('login');
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginUsername').focus();
                    }, 1500);

                } else {
                    showAlert('error', '❌ ' + (data.message || 'Registration failed'));
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('error', '❌ Connection error. Please try again.');
            }

            showLoading(false);
        }

        // Fill demo account credentials
        function fillDemoAccount(username, password) {
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = password;
            
            // Switch to login tab if not already active
            if (!document.getElementById('loginForm').classList.contains('active')) {
                showTab('login');
            }
            
            // Focus on login button
            document.querySelector('#loginForm .btn').focus();
        }

        // Show loading state
        function showLoading(show) {
            const loading = document.getElementById('loadingState');
            const forms = document.querySelectorAll('.auth-form');
            
            if (show) {
                loading.style.display = 'block';
                forms.forEach(form => form.style.display = 'none');
            } else {
                loading.style.display = 'none';
                document.querySelector('.auth-form.active').style.display = 'block';
            }
        }

        // Show alert message
        function showAlert(type, message) {
            const alert = document.getElementById('alertMessage');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
        }

        // Hide alert message
        function hideAlert() {
            document.getElementById('alertMessage').style.display = 'none';
        }

        // Check if user is already logged in
        window.addEventListener('load', function() {
            const token = localStorage.getItem('token');
            if (token) {
                // User is already logged in, redirect to dashboard
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Group Chat: ' + ${room}">Group Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .room-info h2 {
            color: #333;
            margin: 0;
            font-size: 1.5rem;
        }

        .room-details {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .room-stats {
            color: #666;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .online-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 20px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .leave-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .leave-btn:hover {
            background: #ff3838;
            transform: translateY(-1px);
        }

        .connection-status {
            padding: 0.75rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .connected {
            background: #4CAF50;
            color: white;
        }

        .disconnected {
            background: #f44336;
            color: white;
        }

        .connecting {
            background: #ff9800;
            color: white;
        }

        .main-content {
            flex: 1;
            display: flex;
            margin: 1rem;
            gap: 1rem;
            min-height: 0;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 1rem 1.25rem;
            border-radius: 18px;
            word-wrap: break-word;
            animation: messageSlideIn 0.4s ease-out;
            position: relative;
        }

        @keyframes messageSlideIn {
            from { 
                opacity: 0; 
                transform: translateY(15px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.other {
            align-self: flex-start;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 6px;
        }

        .message.system {
            align-self: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            color: #667eea;
            font-style: italic;
            text-align: center;
            font-size: 0.95rem;
            border-radius: 12px;
            font-weight: 500;
        }

        .message-header {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            opacity: 0.8;
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.4;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 0.4rem;
            text-align: right;
        }

        .message.other .message-time {
            text-align: left;
        }

        .typing-indicator {
            padding: 1rem 1.5rem;
            font-style: italic;
            color: #666;
            font-size: 0.9rem;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .typing-dots {
            display: inline-flex;
            gap: 0.3rem;
            margin-left: 0.5rem;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid #f0f0f0;
            background: #fafafa;
        }

        .input-container {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            max-width: 100%;
        }

        #messageInput {
            flex: 1;
            padding: 1rem 1.25rem;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            resize: none;
            min-height: 50px;
            max-height: 120px;
            background: white;
            transition: all 0.3s;
            font-family: inherit;
            line-height: 1.4;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        #sendButton:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .participants-panel {
            width: 280px;
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .participants-header {
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .participants-count {
            background: #667eea;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .participants-list {
            flex: 1;
            overflow-y: auto;
        }

        .participant {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            transition: background 0.3s;
        }

        .participant:hover {
            background: #f8f9fa;
        }

        .participant.you {
            background: rgba(102, 126, 234, 0.1);
        }

        .participant-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .participant-status {
            font-size: 0.8rem;
            color: #666;
        }

        .room-actions {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f0f0;
        }

        .action-btn {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .action-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                margin: 0.5rem;
            }
            
            .participants-panel {
                width: 100%;
                max-height: 200px;
                order: -1;
            }
            
            .header {
                padding: 1rem;
            }
            
            .room-stats {
                flex-direction: column;
                gap: 0.3rem;
                align-items: flex-start;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="room-info">
            <div class="room-details">
                <h2>
                    👥 <span th:text="${room}">general</span>
                </h2>
                <div class="room-stats">
                    <div class="online-indicator">
                        <div class="status-dot"></div>
                        <span>Group Chat Active</span>
                    </div>
                    <span id="participantCount">Connecting...</span>
                </div>
            </div>
        </div>
        
        <div class="user-info">
            <div class="user-profile">
                <div class="user-avatar" th:text="${username.substring(0,1).toUpperCase()}">U</div>
                <span th:text="${username}">User</span>
            </div>
            <button class="leave-btn" onclick="leaveRoom()">
                🚪 Leave Room
            </button>
        </div>
    </div>

    <div class="connection-status connecting" id="connectionStatus">
        🔄 Connecting to group chat...
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="messages-area" id="messageArea">
                <div class="message system">
                    <div class="message-content">
                        Welcome to the <strong th:text="${room}">room</strong> group chat! 👋<br>
                        Start chatting with other members in real-time.
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator"></div>
            
            <div class="input-area">
                <div class="input-container">
                    <textarea id="messageInput" 
                             placeholder="Type your message... (Press Enter to send, Shift+Enter for new line)" 
                             rows="1"
                             maxlength="1000"
                             disabled></textarea>
                    <button id="sendButton" disabled>
                        📤 Send
                    </button>
                </div>
            </div>
        </div>

        <div class="participants-panel">
            <div class="participants-header">
                👥 Group Members
                <span class="participants-count" id="participantsCount">0</span>
            </div>
            
            <div class="participants-list" id="participantsList">
                <div class="participant you">
                    <div class="participant-avatar" th:text="${username.substring(0,1).toUpperCase()}">U</div>
                    <div class="participant-info">
                        <div class="participant-name" th:text="${username} + ' (You)'">You</div>
                        <div class="participant-status">Online</div>
                    </div>
                </div>
            </div>

            <div class="room-actions">
                <button class="action-btn" onclick="copyRoomLink()">
                    🔗 Copy Room Link
                </button>
                <button class="action-btn" onclick="showRoomInfo()">
                    ℹ️ Room Info
                </button>
                <button class="action-btn" onclick="switchRoom()">
                    🔄 Switch Room
                </button>
            </div>
        </div>
    </div>

    <!-- WebSocket libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <script th:inline="javascript">
        // Get user info from server
        const username = /*[[${username}]]*/ 'Anonymous';
        const roomName = /*[[${room}]]*/ 'general';
        
        let stompClient = null;
        let connected = false;
        let participantCount = 0;
        let typingTimer = null;
        let isTyping = false;

        // DOM elements
        const messageArea = document.getElementById('messageArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const connectionStatus = document.getElementById('connectionStatus');
        const typingIndicator = document.getElementById('typingIndicator');
        const participantsList = document.getElementById('participantsList');
        const participantsCount = document.getElementById('participantsCount');
        const participantCountHeader = document.getElementById('participantCount');

        // Initialize user avatar
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        // Connect to WebSocket server
        function connect() {
            console.log('🔌 Connecting to group chat WebSocket...');
            updateConnectionStatus('connecting');
            
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            
            // Hide STOMP debug messages
            stompClient.debug = null;
            
            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            console.log('✅ Connected to group chat!');
            connected = true;
            updateConnectionStatus('connected');
            
            // Subscribe to room messages
            stompClient.subscribe(`/topic/${roomName}`, onMessageReceived);
            
            // Subscribe to typing indicators
            stompClient.subscribe(`/topic/${roomName}/typing`, onTypingReceived);
            
            // Tell server we joined the group
            stompClient.send(`/app/chat/${roomName}/addUser`, {}, 
                JSON.stringify({sender: username, type: 'JOIN'})
            );
            
            // Enable input
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
            
            // Auto-resize textarea
            setupTextareaResize();
        }

        function onError(error) {
            console.error('❌ Group chat connection failed:', error);
            connected = false;
            updateConnectionStatus('disconnected');
            
            // Try reconnecting after 3 seconds
            setTimeout(() => {
                if (!connected) {
                    console.log('🔄 Trying to reconnect to group chat...');
                    connect();
                }
            }, 3000);
        }

        function updateConnectionStatus(status) {
            connectionStatus.className = `connection-status ${status}`;
            
            switch(status) {
                case 'connected':
                    connectionStatus.innerHTML = '✅ Connected to group chat';
                    setTimeout(() => {
                        connectionStatus.style.display = 'none';
                    }, 2000);
                    break;
                case 'connecting':
                    connectionStatus.innerHTML = '🔄 Connecting to group chat...';
                    connectionStatus.style.display = 'block';
                    break;
                case 'disconnected':
                    connectionStatus.innerHTML = '❌ Connection lost - Reconnecting...';
                    connectionStatus.style.display = 'block';
                    break;
            }
        }

        function sendMessage() {
            const messageContent = messageInput.value.trim();
            
            if (messageContent && stompClient && connected) {
                const chatMessage = {
                    sender: username,
                    content: messageContent,
                    type: 'CHAT'
                };
                
                console.log('📤 Sending group message:', messageContent);
                stompClient.send(`/app/chat/${roomName}`, {}, JSON.stringify(chatMessage));
                messageInput.value = '';
                resetTextareaHeight();
                
                // Stop typing indicator
                stopTyping();
            }
        }

        function onMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            console.log('📥 Received group message:', message);
            displayMessage(message);
        }

        function displayMessage(message) {
            const messageElement = document.createElement('div');
            
            if (message.type === 'JOIN' || message.type === 'LEAVE') {
                // System messages (join/leave)
                messageElement.classList.add('message', 'system');
                messageElement.innerHTML = `
                    <div class="message-content">
                        ${message.type === 'JOIN' ? '👋' : '👋'} ${escapeHtml(message.content)}
                    </div>
                    <div class="message-time">${message.timestamp}</div>
                `;
                
                // Update participant count
                if (message.type === 'JOIN') {
                    participantCount++;
                } else if (message.type === 'LEAVE') {
                    participantCount = Math.max(0, participantCount - 1);
                }
                updateParticipantCount();
                
            } else {
                // Regular chat messages
                const isOwnMessage = message.sender === username;
                messageElement.classList.add('message', isOwnMessage ? 'own' : 'other');
                
                const initials = getInitials(message.sender);
                
                messageElement.innerHTML = `
                    ${!isOwnMessage ? `
                        <div class="message-header">
                            <strong>${escapeHtml(message.sender)}</strong>
                        </div>
                    ` : ''}
                    <div class="message-content">${escapeHtml(message.content)}</div>
                    <div class="message-time">${message.timestamp}</div>
                `;
            }
            
            messageArea.appendChild(messageElement);
            
            // Auto-scroll to bottom
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        function onTypingReceived(payload) {
            const typingData = JSON.parse(payload.body);
            
            if (typingData.sender !== username) {
                if (typingData.typing) {
                    showTypingIndicator(typingData.sender);
                } else {
                    hideTypingIndicator();
                }
            }
        }

        function showTypingIndicator(sender) {
            typingIndicator.innerHTML = `
                <span>${escapeHtml(sender)} is typing</span>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
        }

        function hideTypingIndicator() {
            typingIndicator.innerHTML = '';
        }

        function startTyping() {
            if (!isTyping && stompClient && connected) {
                isTyping = true;
                stompClient.send(`/app/chat/${roomName}/typing`, {}, 
                    JSON.stringify({sender: username, typing: true})
                );
            }
        }

        function stopTyping() {
            if (isTyping && stompClient && connected) {
                isTyping = false;
                stompClient.send(`/app/chat/${roomName}/typing`, {}, 
                    JSON.stringify({sender: username, typing: false})
                );
            }
        }

        function updateParticipantCount() {
            const count = Math.max(1, participantCount);
            participantsCount.textContent = count;
            participantCountHeader.textContent = `${count} member${count !== 1 ? 's' : ''} online`;
        }

        function setupTextareaResize() {
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
                
                // Handle typing indicator
                clearTimeout(typingTimer);
                startTyping();
                
                typingTimer = setTimeout(() => {
                    stopTyping();
                }, 1000);
            });
        }

        function resetTextareaHeight() {
            messageInput.style.height = 'auto';
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Room action functions
        function copyRoomLink() {
            const roomLink = `${window.location.origin}/chat?username=YourName&room=${encodeURIComponent(roomName)}`;
            navigator.clipboard.writeText(roomLink).then(() => {
                alert('🔗 Room link copied to clipboard! Share it with others to invite them to this group chat.');
            }).catch(() => {
                prompt('Copy this room link:', roomLink);
            });
        }

        function showRoomInfo() {
            alert(`📊 Group Chat Info:
            
🏠 Room: ${roomName}
👥 Members: ${Math.max(1, participantCount)} online
⏰ Created: Just now
🔗 Shareable: Yes
            
Share the room link to invite more people to join this group chat!`);
        }

        function switchRoom() {
            if (confirm('🔄 Do you want to switch to a different group chat room?')) {
                window.location.href = '/';
            }
        }

        function leaveRoom() {
            if (confirm('👋 Are you sure you want to leave this group chat?')) {
                if (stompClient && connected) {
                    stompClient.disconnect();
                }
                window.location.href = '/';
            }
        }

        // Event listeners
        messageInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        // Disconnect when leaving page
        window.addEventListener('beforeunload', function() {
            if (stompClient && connected) {
                stompClient.disconnect();
            }
        });

        // Initialize
        console.log(`👥 Welcome ${username} to group chat room: ${roomName}`);
        updateParticipantCount();
        connect();
    </script>
</body>
</html>

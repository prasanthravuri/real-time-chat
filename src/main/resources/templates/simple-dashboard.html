<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .room-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 1rem 2rem;
            margin: 0.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        .room-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="logout-btn" onclick="logout()">Logout</button>
        
        <h1>🎉 Dashboard - Authentication Working!</h1>
        <p>Welcome! Choose a chat room:</p>
        
        <div>
            <button class="room-btn" onclick="joinRoom('general')">💬 General Chat</button>
            <button class="room-btn" onclick="joinRoom('tech')">💻 Tech Talk</button>
            <button class="room-btn" onclick="joinRoom('gaming')">🎮 Gaming</button>
        </div>
        
        <h3>User Info:</h3>
        <div id="userInfo">Loading...</div>
        
        <h3>Debug Info:</h3>
        <div id="debugInfo">
            <p>Token stored: <span id="tokenStatus">Checking...</span></p>
            <p>User data: <span id="userData">Checking...</span></p>
        </div>
    </div>

    <script>
        // Check authentication and display user info
        window.addEventListener('load', function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            console.log('🔍 Token:', token ? 'Present' : 'Missing');
            console.log('🔍 User:', user);
            
            // Update debug info
            document.getElementById('tokenStatus').textContent = token ? 'Yes ✅' : 'No ❌';
            document.getElementById('userData').textContent = user.username ? user.username + ' ✅' : 'No ❌';
            
            if (!token || !user.username) {
                document.getElementById('userInfo').innerHTML = '❌ Not logged in - <a href="/" style="color: yellow;">Go to Login</a>';
                return;
            }
            
            // Display user info
            const displayName = user.firstName && user.lastName 
                ? `${user.firstName} ${user.lastName}`
                : user.username;
            
            document.getElementById('userInfo').innerHTML = `
                <p>👤 <strong>${displayName}</strong></p>
                <p>📧 ${user.email}</p>
                <p>🎭 Roles: ${user.roles ? user.roles.join(', ') : 'None'}</p>
            `;
        });
        
        function joinRoom(roomName) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.username) {
                alert('❌ Please login first!');
                window.location.href = '/';
                return;
            }
            
            console.log('🚀 Joining room:', roomName);
            window.location.href = `/chat?username=${encodeURIComponent(user.username)}&room=${encodeURIComponent(roomName)}`;
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            alert('👋 Logged out successfully!');
            window.location.href = '/';
        }
    </script>
</body>
</html>
